name: Official source fetch (temporary)

# 公式資料の原文を取得して本文（または該当箇所）をログに出す一時ワークフロー。作業ブランチでのみ動き、確認後に削除する。
on:
  push:
    branches:
      - claude/pensive-maxwell-id07ll
    paths:
      - .github/fetch/**
      - .github/workflows/official-fetch.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Fetch and extract
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            name=$(cut -d'|' -f1 <<< "$line"); kind=$(cut -d'|' -f2 <<< "$line"); url=$(cut -d'|' -f3 <<< "$line")
            rest=$(cut -d'|' -f4- <<< "$line"); context=${rest##*|}; pattern=${rest%|*}
            echo "=================== $name $url"
            code=$(curl -sSL -m 90 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -o doc.bin -w '%{http_code}' "$url" || echo failed)
            echo "HTTP $code, $(wc -c < doc.bin 2>/dev/null) bytes"
            [ "$code" = "200" ] || continue
            python3 .github/fetch/extract.py doc.bin "$kind" "$pattern" "$context" || true
          done < .github/fetch/urls.txt
