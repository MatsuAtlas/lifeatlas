name: fetch-official-sources
on:
  push:
    branches: [claude/gallant-albattani-7gafa6]
    paths: [".github/source-fetch/**"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl xlrd
      - run: python3 -u .github/source-fetch/hud.py
