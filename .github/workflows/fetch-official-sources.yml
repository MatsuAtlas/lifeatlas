name: Fetch official sources (temporary)
on:
  push:
    branches: [claude/gallant-albattani-7gafa6]
    paths: [.github/source-fetch/**]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pypdf
      - run: python -u .github/source-fetch/fetch.py .github/source-fetch/urls.txt
