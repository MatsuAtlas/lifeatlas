name: Production check (temporary)

# 本番反映の読み取り確認用の一時ワークフロー。作業ブランチでのみ動き、確認後に削除する。
on:
  push:
    branches:
      - claude/pensive-maxwell-id07ll

permissions:
  contents: read
  deployments: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Vercel deployments recorded on GitHub for main
        run: |
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "main head: $sha"
          gh api "repos/$REPO/deployments?sha=$sha&per_page=10" --jq '.[] | "\(.id) \(.environment) \(.created_at) \(.creator.login)"' | tee deployments.txt
          : > urls.txt
          while read -r id env created creator; do
            gh api "repos/$REPO/deployments/$id/statuses" --jq '.[] | "  \(.state) \(.created_at) \(.environment_url // "")"'
            gh api "repos/$REPO/deployments/$id/statuses" --jq '.[] | .environment_url // empty' >> urls.txt
          done < deployments.txt
          echo "latest production deployments on any commit:"
          gh api "repos/$REPO/deployments?environment=Production&per_page=3" --jq '.[] | "\(.id) \(.sha[0:7]) \(.created_at)"'
      - name: Production /api/cities
        run: |
          printf '%s\n' https://lifeatlas.vercel.app https://life-atlas-global-2026.dreamy-gnat-5451.chatgpt.site >> urls.txt
          sort -u urls.txt | while read -r base; do
            [ -z "$base" ] && continue
            code=$(curl -sS -m 20 -o out.json -w '%{http_code}' "$base/api/cities" || echo "curl-failed")
            echo "$base/api/cities -> $code"
            if [ "$code" = "200" ]; then
              jq -c '.coverage, [.cities[] | select(.id == "taipei" or .id == "jakarta") | {id, calculationStatus}]' out.json || head -c 300 out.json
            fi
          done
